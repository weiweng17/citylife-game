<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>都市浮生 · 在线试玩</title>
  <style>
    html,body{height:100%;margin:0;background:#0f1420;color:#eef3ff;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
    body{display:grid;place-items:center;overflow:hidden}
    .card{width:min(900px,calc(100vw - 40px));padding:36px;border:1px solid #2d374f;border-radius:22px;background:linear-gradient(180deg,#182033,#111725);box-shadow:0 24px 80px rgba(0,0,0,.45)}
    h1{margin:0 0 12px;font-size:42px}.tag{display:inline-block;padding:6px 10px;border-radius:999px;background:#26324b;color:#bcd2ff;font-size:13px}
    p{line-height:1.8;color:#b9c4d8}.status{margin-top:24px;padding:18px;border-radius:14px;background:#0d1320;border:1px solid #29344c}.ok{color:#86e8b3}.muted{color:#7f8aa0;font-size:13px;margin-top:18px}
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">DEV WEB PREVIEW</span>
    <h1>都市浮生</h1>
    <p>线上试玩通道已经接入 GitHub Actions。后续主分支每次更新后，这个网址会自动刷新为最新版。</p>
    <div class="status"><strong class="ok">✓ 自动部署管线已建立</strong><br><br>当前正在迁入 MAP-002 Godot 4.7.2 项目源码与地图资源。迁入完成后，这里将直接加载游戏，不再需要下载 ZIP 或本地反复覆盖文件。</div>
    <div class="muted">CityLife · 1280×720 · Godot 4.7.2 · Web Preview Bootstrap</div>
  </main>
</body>
</html>
