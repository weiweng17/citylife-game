name: Verify Cooking Action

on:
  push:
    branches:
      - agent/gameplay-cook-action-001
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-cooking-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cooking-action:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Import Godot assets and compile scripts
        shell: bash
        run: |
          set -e
          rm -rf .godot
          docker run --rm -v "$PWD:/workspace" -w /workspace barichello/godot-ci:4.7.2 \
            godot --headless --editor --path /workspace --quit
      - name: Run COOK-ACTION-001 headless acceptance
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/workspace" -w /workspace barichello/godot-ci:4.7.2 \
            godot --headless --path /workspace --script res://tests/cook_action_test.gd 2>&1 | tee godot.log
      - name: Upload cooking acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-action-${{ github.sha }}
          if-no-files-found: error
          path: |
            cook-test-report.md
            cook-test.png
            godot.log
