name: Validate Bedroom Life MVP

on:
  push:
    branches: [feature/bedroom-life-mvp]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse Godot project
        shell: bash
        run: |
          set -e
          rm -rf .godot
          docker run --rm -v "$PWD:/workspace" -w /workspace barichello/godot-ci:4.7.2 godot --headless --editor --quit

      - name: Export Web smoke test
        shell: bash
        run: |
          set -e
          rm -rf build/web
          mkdir -p build/web
          docker run --rm -v "$PWD:/workspace" -w /workspace barichello/godot-ci:4.7.2 godot --headless --export-release "Web" /workspace/build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.pck
          test -f build/web/index.wasm
