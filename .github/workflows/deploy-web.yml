name: Deploy CityLife Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Export Godot Web
        shell: bash
        run: |
          set -e
          rm -rf build/web .godot
          mkdir -p build/web
          docker run --rm -v "$PWD:/workspace" -w /workspace barichello/godot-ci:4.7.2 godot --headless --export-release "Web" /workspace/build/web/index.html

      - name: Verify Web build
        run: |
          test -f build/web/index.html
          test -f build/web/index.pck
          test -f build/web/index.wasm
          touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
