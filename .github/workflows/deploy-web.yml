name: Deploy CityLife Web Preview

on:
  push:
    branches: [main, chatgpt-dev]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch/ref whose game files should be exported
        required: false
        default: main
      source_sha:
        description: Development commit represented by this preview
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  actions: write

concurrency:
  group: citylife-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref_name }}

      - name: Export Godot Web
        shell: bash
        run: |
          set -e
          rm -rf build/web .godot
          mkdir -p build/web
          docker run --rm -v "$PWD:/workspace" -w /workspace barichello/godot-ci:4.7.2 godot --headless --export-release "Web" /workspace/build/web/index.html

      - name: Verify Web build
        run: |
          set -e
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
          touch build/web/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  dispatch_dev_preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/chatgpt-dev' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy from main context
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-web.yml',
              ref: 'main',
              inputs: {
                source_ref: 'chatgpt-dev',
                source_sha: context.sha
              }
            });
            core.notice(`Preview deployment dispatched for ${context.sha}`);

  deploy:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/chatgpt-dev') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/chatgpt-dev') }}
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify deployed site
        shell: bash
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -e
          BASE="${PAGE_URL%/}"
          echo "Checking $BASE"
          ok=0
          for i in $(seq 1 18); do
            if curl -fsSL --max-time 20 "$BASE/" -o /tmp/index.html \
              && curl -fsSL --max-time 30 "$BASE/index.pck" -o /tmp/index.pck \
              && curl -fsSL --max-time 30 "$BASE/index.wasm" -o /tmp/index.wasm \
              && test -s /tmp/index.html \
              && test -s /tmp/index.pck \
              && test -s /tmp/index.wasm; then
              ok=1
              break
            fi
            echo "Pages not ready yet ($i/18); retrying in 10s..."
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "Live smoke test failed for $BASE"
            exit 1
          fi
          echo "Live smoke test passed: $BASE"

  report_failure:
    if: >-
      ${{ always() && (
        needs.build.result == 'failure' ||
        needs.dispatch_dev_preview.result == 'failure' ||
        needs.deploy.result == 'failure' ||
        needs.smoke.result == 'failure'
      ) }}
    needs: [build, dispatch_dev_preview, deploy, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Open or update CI failure issue
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha || github.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[AUTO-CI] CityLife preview deployment failed';
            const body = [
              'Automated preview pipeline failed.',
              '',
              `- Workflow branch: ${context.ref.replace('refs/heads/', '')}`,
              `- Source commit: ${process.env.SOURCE_SHA}`,
              `- Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              'The ChatGPT development watcher should inspect the failing job and continue fixing chatgpt-dev.'
            ].join('\n');
            const { data } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = data.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }

  report_recovery:
    if: ${{ always() && needs.deploy.result == 'success' && needs.smoke.result == 'success' }}
    needs: [build, deploy, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Close stale CI failure issue after recovery
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ github.event.inputs.source_sha || github.sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = '[AUTO-CI] CityLife preview deployment failed';
            const { data } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = data.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Recovered for source commit ${process.env.SOURCE_SHA}. Deployment and live smoke test passed. Run: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
