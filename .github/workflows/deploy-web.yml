name: Deploy CityLife Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot source
        shell: bash
        run: |
          set -e
          rm -rf game-src
          mkdir -p game-src
          if [ -f citylife_WEB001_SourceUpload.zip ]; then
            echo "Found uploaded Godot source archive."
            unzip -q citylife_WEB001_SourceUpload.zip -d game-src
          elif [ -f project.godot ]; then
            echo "Godot project already exists at repository root."
            cp -a . game-src
          else
            echo "No Godot source archive yet; bootstrap preview will be published."
          fi

      - name: Export Godot Web
        shell: bash
        run: |
          set -e
          mkdir -p build/web
          if [ -f game-src/project.godot ]; then
            echo "Exporting CityLife Web with Godot 4.7.2..."
            docker run --rm \
              -v "$PWD/game-src:/workspace" \
              -w /workspace \
              barichello/godot-ci:4.7.2 \
              godot --headless --verbose --export-release "Web" build/web/index.html
            cp -a game-src/build/web/. build/web/
          else
            cp -R web-preview/. build/web/
          fi

      - name: Disable Jekyll
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
