name: Deploy CityLife Web Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare output
        shell: bash
        run: |
          set -e
          mkdir -p build/web
          if [ -f project.godot ]; then
            echo "Godot project found. Exporting Web with Godot 4.7.2..."
            docker run --rm \
              -v "$PWD:/workspace" \
              -w /workspace \
              barichello/godot-ci:4.7.2 \
              godot --headless --verbose --export-release "Web" build/web/index.html
          else
            echo "Godot source has not been migrated yet; publishing bootstrap preview."
            cp -R web-preview/. build/web/
          fi

      - name: Disable Jekyll
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
